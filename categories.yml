           ocr, computer-vision, nlp, neural-network, cuda, inference, quantization,
           3d-reconstruction, nerf, view-synthesis, gaussian-splatting, monocular, depth-estimation]
      - name_regex: "(?i)(deepseek|qwen|llama|ollama|vllm|litellm|langchain|openai|gpt|claude|gemini|mistral|stable-diffusion|comfyui|whisper|diffusers|pix2pix|opencode|aiml|text-generation-webui)"
