# GitHub Stars 分类规则
#
# 匹配顺序自上而下，先命中哪个分类就归到哪个分类（first match wins）。
# 所以：范围窄的、你特别在意的分类放前面，宽泛的放后面。
#
# 每个分类支持两种写法（可同时使用，需同时满足）：
#   match:      单个条件块，块内所有键是 AND 关系
#   match_any:  条件块列表，任意一块命中即可（OR）
#
# 可用条件键：
#   topics_any         仓库 topics 中命中任意一个（精确匹配 topic，大小写不敏感）
#   topics_all         必须包含全部 topics
#   language           语言，可写字符串或列表，如 [Python, Rust]
#   name_regex         正则匹配「仓库名 + owner/repo」
#   description_regex  正则匹配描述
#   min_stars / max_stars
#   archived: true/false
#
# 名字、顺序随便改；改完 push 就会自动重新生成 README。

settings:
  sort: stars            # stars | starred | updated | name
  fallback_name: "📦 未分类"
  include_archived: true
  show_topics: 0         # >0 时在每个条目后附带这么多 topic 标签
  max_per_category: 0    # >0 时每个分类最多展示这么多条，其余折叠

# 不想出现在清单里的仓库（完全匹配 full_name）
exclude: []
#  - "torvalds/linux"
#  - "some/noisy-repo"

