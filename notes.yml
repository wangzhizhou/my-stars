# 单仓库备注
#
# 会渲染成 README 里每条下面的一行引用（💡），并且能被 GitHub 全文搜索。
#
# 写备注的原则：不要复述 README 里已有的描述，只写三件事 ——
#   1. 什么时候会想起它
#   2. 怎么上手 / 关键命令
#   3. 有什么坑，或者和同类工具的关系
#
# 键是 owner/repo（大小写不敏感）。想加新的直接往下加，改完 push 自动生效。
# 全部 661 个仓库见 data/stars.json。
#
# 下面这份是机器按分类生成的草稿：我熟悉的部分写了实际内容，不确定的没写。
# 空着不代表不重要，只代表「不该由我替你编」。

