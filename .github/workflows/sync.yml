name: Sync Stars

on:
  schedule:
    # UTC 20:10 ≈ 北京时间 04:10
    - cron: "10 20 * * *"
  workflow_dispatch:

  # 改配置后自动重新生成 README
  push:
    branches: [main]
    paths:
      - "categories.yml"
      - "notes.yml"
      - "header.md"
      - "sync_stars.py"
      - ".github/workflows/sync.yml"

# 需要写权限才能把生成的 README 提交回来
permissions:
  contents: write

concurrency:
  group: sync-stars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase 时需要的完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate README
        env:
          # GITHUB_TOKEN 足够读公开 star，只是用来提高限额（匿名 60 次/小时）
          GH_TOKEN: ${{ github.token }}
          STARS_USER: ${{ github.repository_owner }}
        run: python sync_stars.py

      - name: Commit & push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # README.md / data/stars.json 是纯生成物，直接覆盖远端版本，不做合并
          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --mixed "origin/$BRANCH"          # 把基线对齐到远端最新，工作区内容保留
            git add README.md data/stars.json

            if git diff --quiet --cached; then
              echo "没有变化，跳过提交"
              exit 0
            fi

            git commit --quiet -m "chore: sync stars [skip ci]"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "已推送到 $BRANCH"
              exit 0
            fi
            echo "推送失败，重试 ($attempt/3)"
            sleep 5
          done
          echo "三次推送均失败" >&2
          exit 1
